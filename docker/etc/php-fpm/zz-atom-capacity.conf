; Operations #195: opt-in web-only override, loaded after bootstrap atom.conf.
; Candidate values require staging save/export/OAI acceptance before production.
[atom]
listen.backlog = 16
; FPM checks periodically: allow up to about160s before enforcement, plus load jitter.
; Nginx read timeout180s is intentionally longer.
request_terminate_timeout = 120s
; Do not change post-response/background semantics without an application audit.
request_terminate_timeout_track_finished = no
pm.status_path = /__atom_capacity_status
pm.status_listen = 127.0.0.1:9001
; No URLs, query strings, credentials or client addresses in these added fields.
access.format = "capacity rid=%{ATOM_REQUEST_ID}e status=%s duration_us=%{microseconds}d cpu=%C memory_bytes=%M"
